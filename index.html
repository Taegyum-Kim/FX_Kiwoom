<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>USD/KRW 예측 대시보드</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
    }

    .value {
      font-size: 42px;
      font-weight: bold;
      color: #111;
    }

    .signal {
      font-size: 20px;
      color: #555;
    }

    .time {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>USD/KRW 예측 결과</h1>
    <div class="value" id="predictedValue">불러오는 중...</div>
    <p class="signal" id="signal"></p>
    <p class="time" id="updatedAt"></p>
  </div>

  <script>
    fetch("result.json")
      .then(response => response.json())
      .then(data => {
        document.getElementById("predictedValue").innerText =
          data.predicted_value + " 원";

        document.getElementById("signal").innerText =
          data.signal;

        document.getElementById("updatedAt").innerText =
          "업데이트 시간: " + data.updated_at;
      });
  </script>
</body>
</html>
